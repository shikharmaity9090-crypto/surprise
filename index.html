<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Resize canvas
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Move origin to center
ctx.translate(canvas.width / 2, canvas.height / 2);

const colors = [
    "red",
    "blue",
    "lime",
    "yellow",
    "cyan",
    "magenta",
    "orange",
    "pink"
];

// Draw Heart
for (let i = 0; i < 120; i++) {

    let angle = i * Math.PI * 2 / 120;

    let x = 16 * Math.pow(Math.sin(angle), 3) * 15;

    let y = -(13 * Math.cos(angle)
            - 5 * Math.cos(2 * angle)
            - 2 * Math.cos(3 * angle)
            - Math.cos(4 * angle)) * 15;

    ctx.strokeStyle = colors[Math.floor(Math.random() * colors.length)];

    for (let j = 0; j < 8; j++) {

        ctx.beginPath();
        ctx.moveTo(x, y);

        ctx.lineTo(
            x + 6 * Math.cos(j * Math.PI / 4),
            y + 6 * Math.sin(j * Math.PI / 4)
        );

        ctx.stroke();
    }
}

// Draw Text
ctx.beginPath();

for (let i = 0; i <= 360; i++) {
    let t = i * Math.PI / 180;

    let x = 16 * Math.pow(Math.sin(t), 3) * 15;
    let y = -(13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t)) * 15;

    if (i === 0)
        ctx.moveTo(x, y);
    else
        ctx.lineTo(x, y);
}

ctx.strokeStyle = "red";
ctx.lineWidth = 4;
ctx.stroke();
</script>

</body>
</html>
